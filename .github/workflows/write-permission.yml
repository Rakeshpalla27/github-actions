name: Write Permission Practice

on:
  workflow_dispatch:

# Give the workflow permission to write repository contents
permissions:
  contents: write

jobs:
  write-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create test file
        run: |
          echo "This file was created by GitHub Actions" > github-actions-test.txt
          echo "Created at: $(date)" >> github-actions-test.txt

      - name: Show file
        run: |
          cat github-actions-test.txt

      - name: Commit and push file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-actions-test.txt
          git commit -m "Test GitHub Actions write permission"
          git push
